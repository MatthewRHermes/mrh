# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: mrh continuous integration

on: 
  push:
    branches-ignore:
      - 'master'
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8","3.9","3.10"]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt-get -qq install \
          gcc \
          g++ \
          libblas-dev \
          liblapack-dev \
          cmake \
          curl
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest pyscf 

        # python -m pip install flake8 pytest "git+https://github.com/pyscf/pyscf@master"
        # python -m pip install -r pyscf_version.txt
        # TODO: figure out how to actually patch a more recent github commit over a pip wheel.
        # 'pip install -r pyscf_version.txt' does nothing by itself because the version number
        # is generally the same as the pip wheel, but even if it were higher, it would just
        # discard the entire previous installation and compile from scratch, and pyscf is too
        # big for this to be a viable way to do github actions
        python -m pip install -r pyscf-forge_version.txt
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Install
      run: |
        ./.github/workflows/cmake_make.sh
    - name: Test with pytest (CPU only)
      run: |
        ./.github/workflows/test.sh
    - name: Build libgpu with the host backend
      # ARCH=linux-cpu-gnu builds against pm/host, so no GPU or vendor toolchain is
      # needed. It installs libgpu.so into my_pyscf/gpu/, which is where the
      # libgpu.py stub looks for it. Runs after the CPU pass on purpose: stage one
      # must not be able to see the library.
      run: |
        python -m pip install pybind11
        make -C gpu/src ARCH=linux-cpu-gnu BLAS_LIB=-lblas install
    - name: Smoke-check that libgpu imports
      # A .so that builds but fails to load (e.g. GLIBCXX skew) would otherwise
      # surface as an opaque collection error from gpu4mrh/patch_pyscf.py.
      run: |
        python -c "from mrh.my_pyscf.gpu import libgpu; print('libgpu devices:', libgpu.get_num_devices())"
    - name: Test with pytest (libgpu built)
      env:
        RUN_GPU: 1
      run: |
        ./.github/workflows/test.sh
